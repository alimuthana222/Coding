<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 520px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .upload-area {
            border: 2px dashed #c0c0c0;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f9f9f9;
            position: relative;
        }

        .upload-area:hover,
        .upload-area.drag-over {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .upload-area p {
            color: #555;
            font-size: 15px;
            margin-bottom: 6px;
        }

        .upload-area span {
            color: #999;
            font-size: 13px;
        }

        #fileInput {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-section {
            display: none;
            margin-top: 24px;
        }

        .preview-section.visible {
            display: block;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .preview-label {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .remove-btn:hover {
            background: #ffeaea;
        }

        #imagePreview {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            background: #f5f5f5;
            display: block;
        }

        .file-info {
            margin-top: 10px;
            padding: 10px 14px;
            background: #f0f8ff;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            display: flex;
            justify-content: space-between;
        }

        .file-name {
            font-weight: 600;
            color: #2c3e50;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }

        .file-size {
            color: #888;
            flex-shrink: 0;
        }

        .error-msg {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: #fff0f0;
            border: 1px solid #ffd0d0;
            border-radius: 8px;
            color: #e74c3c;
            font-size: 13px;
        }

        .error-msg.visible {
            display: block;
        }

        .upload-btn {
            display: block;
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .upload-btn:hover:not(:disabled) {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .upload-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .upload-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .success-msg {
            display: none;
            margin-top: 16px;
            padding: 14px;
            background: #f0fff4;
            border: 1px solid #b2dfdb;
            border-radius: 10px;
            color: #27ae60;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .success-msg.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 Image Upload</h1>
        <p class="subtitle">Select or drag and drop an image to upload</p>

        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" accept="image/*">
            <span class="upload-icon">🖼️</span>
            <p>Click to browse or drag &amp; drop an image here</p>
            <span>Supports JPG, PNG, GIF, WebP &bull; Max size: 10 MB</span>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="preview-section" id="previewSection">
            <div class="preview-header">
                <span class="preview-label">Preview</span>
                <button class="remove-btn" id="removeBtn" type="button">✕ Remove</button>
            </div>
            <img id="imagePreview" src="" alt="Image preview">
            <div class="file-info">
                <span class="file-name" id="fileName"></span>
                <span class="file-size" id="fileSize"></span>
            </div>
        </div>

        <button class="upload-btn" id="uploadBtn" type="button" disabled>Upload Image</button>

        <div class="success-msg" id="successMsg">
            ✅ Image uploaded successfully!
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const previewSection = document.getElementById('previewSection');
        const imagePreview = document.getElementById('imagePreview');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const removeBtn = document.getElementById('removeBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        const MAX_SIZE_MB = 10;
        const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
        const BYTES_PER_KB = 1024;

        function formatSize(bytes) {
            if (bytes < BYTES_PER_KB) return bytes + ' B';
            if (bytes < BYTES_PER_KB * BYTES_PER_KB) return (bytes / BYTES_PER_KB).toFixed(1) + ' KB';
            return (bytes / (BYTES_PER_KB * BYTES_PER_KB)).toFixed(2) + ' MB';
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('visible');
        }

        function clearError() {
            errorMsg.textContent = '';
            errorMsg.classList.remove('visible');
        }

        function clearSuccess() {
            successMsg.classList.remove('visible');
        }

        function handleFile(file) {
            clearError();
            clearSuccess();

            if (!ALLOWED_TYPES.includes(file.type)) {
                showError('Invalid file type. Please select a JPG, PNG, GIF, or WebP image.');
                resetPreview();
                return;
            }

            if (file.size > MAX_SIZE_MB * BYTES_PER_KB * BYTES_PER_KB) {
                showError('File is too large. Maximum allowed size is ' + MAX_SIZE_MB + ' MB.');
                resetPreview();
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                imagePreview.src = e.target.result;
                fileName.textContent = file.name;
                fileSize.textContent = formatSize(file.size);
                previewSection.classList.add('visible');
                uploadBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        function resetPreview() {
            previewSection.classList.remove('visible');
            imagePreview.src = '';
            fileName.textContent = '';
            fileSize.textContent = '';
            uploadBtn.disabled = true;
            fileInput.value = '';
        }

        fileInput.addEventListener('change', function () {
            if (this.files && this.files[0]) {
                handleFile(this.files[0]);
            }
        });

        uploadArea.addEventListener('dragover', function (e) {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', function () {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', function (e) {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) {
                // Sync the dropped file into the file input so both paths stay consistent
                const dt = new DataTransfer();
                dt.items.add(file);
                fileInput.files = dt.files;
                handleFile(file);
            }
        });

        removeBtn.addEventListener('click', function () {
            resetPreview();
            clearError();
            clearSuccess();
        });

        uploadBtn.addEventListener('click', function () {
            clearSuccess();
            // Simulate upload (in a real app, this would send to a server)
            uploadBtn.disabled = true;
            uploadBtn.textContent = 'Uploading…';

            setTimeout(function () {
                uploadBtn.textContent = 'Upload Image';
                successMsg.classList.add('visible');
                resetPreview();
            }, 1200);
        });
    </script>
</body>
</html>
